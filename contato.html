<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SD Bonés — Contato</title>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16110d;
    --surface:#1f1810;
    --stitch:#c89b3c;
    --thread-red:#9c3b2c;
    --cream:#f3ece1;
    --muted:#a89a86;
    --line: rgba(200,155,60,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 6px),
      var(--bg);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
  }
  .card{
    width:100%;
    max-width:380px;
    position:relative;
    padding:36px 26px 28px;
    background:var(--surface);
    border-radius:18px;
    border:1.5px dashed var(--line);
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.7), inset 0 0 0 6px rgba(0,0,0,0.15);
  }
  .card::before{
    content:"";
    position:absolute;
    inset:9px;
    border:1px dashed rgba(243,236,225,0.12);
    border-radius:12px;
    pointer-events:none;
  }
  .patch{
    width:88px;
    height:88px;
    margin:0 auto 18px;
    border-radius:50%;
    background: radial-gradient(circle at 32% 28%, #2c2118, #14100b 72%);
    border:3px dashed var(--stitch);
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 8px 18px rgba(0,0,0,0.5);
  }
  .patch span{
    font-family:'Anton',sans-serif;
    font-size:30px;
    letter-spacing:1px;
    color:var(--stitch);
    transform: translateY(1px);
  }
  h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:34px;
    letter-spacing:2px;
    text-align:center;
    margin:0 0 4px;
    color:var(--cream);
  }
  .tagline{
    text-align:center;
    font-size:12.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 26px;
    font-weight:600;
  }
  .divider{
    border:none;
    border-top:1px dashed var(--line);
    margin:0 0 22px;
  }
  .actions{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:26px;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:14px 16px;
    border-radius:10px;
    text-decoration:none;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.3px;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn svg{ width:18px; height:18px; flex:none; }
  .btn-primary{
    background:var(--stitch);
    color:#1a1309;
  }
  .btn-outline{
    background:transparent;
    border:1.5px solid rgba(243,236,225,0.25);
    color:var(--cream);
  }
  .btn-outline:hover, .btn-primary:hover{ filter:brightness(1.08); }

  .info{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.8;
  }
  .info strong{ color:var(--cream); font-weight:600; }
  .badge{
    text-align:center;
    margin-top:22px;
    font-size:10.5px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--muted);
    opacity:0.8;
  }
  .badge span{ color:var(--thread-red); }
</style>
</head>
